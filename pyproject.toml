[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "besslib"
version = "0.3.0"
description = "State of health from battery storage operating data, with confidence bands, in the fields of EU Regulation 2023/1542 Annex VII, and a battery pack simulator with fault cases that tests it against a known truth."
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause AND Apache-2.0"
license-files = ["LICENSE", "src/besslib/sim/bus/models/LICENSE"]
authors = [{ name = "Islam Ghonaiem", email = "ghonaiem@vgtai.com" }]
keywords = [
    "battery",
    "battery energy storage",
    "BESS",
    "state of health",
    "capacity estimation",
    "EU Battery Regulation",
    "Annex VII",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = ["numpy>=2.0", "pandas>=2.2.2", "pyarrow>=16"]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
modbus = ["pymodbus>=3.16.1"]
dev = ["pytest>=8", "matplotlib>=3.8", "pymodbus>=3.16.1", "pysunspec2>=1.3"]

[project.urls]
Source = "https://github.com/GhonAI/besslib"
Documentation = "https://github.com/GhonAI/besslib/tree/main/docs"
Issues = "https://github.com/GhonAI/besslib/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"besslib.io" = ["figgener_meta/*.csv", "figgener_meta/*.md"]
"besslib.data" = ["sample_05/*.parquet", "sample_05/NOTICE.md"]
"besslib.sim" = ["cases/*.toml", "presets/*.toml", "presets/NOTICE.md"]
"besslib.sim.bus" = ["models/*.json", "models/LICENSE", "models/NOTICE.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
