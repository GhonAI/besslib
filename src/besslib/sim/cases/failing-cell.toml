# Case 3, a failing cell: as cell-imbalance with sd 1 % and balancing on, and one group gets a leak (a resistor
# across its cell) on a random day in months 13-24. Settings change the leak's current and the balancing.
# Every value is an example value, not from a source, unless a comment says otherwise.
[case]
name = "failing-cell"
description = "One cell group with a soft internal short from a random day; the BMS's balancing answers it"
start = "2020-01-01"
months = 36
step_s = 10
update_s = 1800
cell_every_s = 600
chemistry = "NMC"
pack_name = "besslib failing-cell pack"

[cell]
preset = "nmc"
scale_to_ah = 100.0

[pack]
groups = 14
series = 1
capacity_spread_sd = 0.01  # example value, not from a source
self_discharge_mean_a = 0.002  # example value, not from a source
self_discharge_sd_a = 0.0005  # example value, not from a source
fade_points_per_year = 2.0  # example value, not from a source

[thermal]
mode = "prescribed"

[temperature.pack]
mean_c = 25.0

[temperature.ambient]
mean_c = 20.0

[bms]
v_cell_max = 4.15  # example value, not from a source
v_cell_min = 3.20  # example value, not from a source
stop_sigma_v = 0.005  # example value, not from a source
stop_rule = "cells"
supply_a = 0.05  # example value, not from a source
balance = true
balance_v = 4.0  # example value, not from a source
balance_spread_v = 0.010  # example value, not from a source
bleed_ohm = 20.0  # example value, not from a source

# leak_a is the current at 3.7 V per cell; 0 plants no leak and draws the same onset day and group (the controls).
[[event]]
kind = "leak"
from_month = 13
to_month = 24
leak_a = 0.015  # example value, not from a source

[duty]
kind = "home"
capacity_ah = 100.0

[sensors]
current_gain_max = 0.005
current_noise_a = 0.05
voltage_noise_v = 0.005
voltage_gain_max = 0.0025
